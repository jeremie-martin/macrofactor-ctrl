[project]
name = "mf"
version = "0.1.0"
description = "Desktop control for the MacroFactor Android app: CLI, web UI and local food history."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "uiautomator2>=3.2",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[project.scripts]
mf = "mf.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
